name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice imagemagick ghostscript

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format:check

      - name: Build
        run: yarn build:all

      - name: Run tests
        run: yarn test

      # markdown commands (pure Node.js, all platforms)
      - name: Run markdown command (simple_text)
        run: yarn cli markdown samples/simple_text.md

      - name: Run markdown command (code_samples)
        run: yarn cli markdown samples/code_samples.md

      - name: Run markdown command (mermaid_diagrams)
        run: yarn cli markdown samples/mermaid_diagrams.md --mermaid

      - name: Run markdown command (tables_data)
        run: yarn cli markdown samples/tables_data.md

      # Golden file tests: compare generated output against reference fixtures
      - name: Golden test (simple_text)
        run: diff tests/fixtures/simple_text.json scripts/simple_text/simple_text.json

      - name: Golden test (code_samples)
        run: diff tests/fixtures/code_samples.json scripts/code_samples/code_samples.json

      - name: Golden test (mermaid_diagrams)
        run: diff tests/fixtures/mermaid_diagrams.json scripts/mermaid_diagrams/mermaid_diagrams.json

      - name: Golden test (tables_data)
        run: diff tests/fixtures/tables_data.json scripts/tables_data/tables_data.json

      # extend merge command (pure Node.js, all platforms)
      - name: Setup extend merge test fixtures
        run: |
          mkdir -p scripts/merge_test output/merge_test/merge_test
          cp tests/fixtures/merge_test/extended_script.json scripts/merge_test/extended_script.json
          cp tests/fixtures/merge_test/mulmo_view_input.json output/merge_test/merge_test/mulmo_view.json

      - name: Run extend merge command
        run: yarn cli extend merge merge_test

      - name: Golden test (extend merge)
        run: diff tests/fixtures/merge_test/mulmo_view_expected.json output/merge_test/merge_test/mulmo_view.json

      # marp commands (npm dependency, all platforms)
      - name: Run marp command (yarn shortcut)
        run: yarn marp samples/sample.md

      - name: Run marp command with theme (yarn shortcut)
        run: yarn marp samples/custom_theme_demo.md --theme samples/custom-ocean.css

      - name: Run marp command (yarn cli)
        run: yarn cli marp samples/marp_recipes.md

      # pptx/pdf commands (require LibreOffice/ImageMagick, Linux only)
      - name: Run pptx command (yarn shortcut)
        if: runner.os == 'Linux'
        run: yarn pptx samples/omochikaeri.pptx

      - name: Run pdf command (yarn shortcut)
        if: runner.os == 'Linux'
        run: yarn pdf samples/20251008_2.pdf

      - name: Run pptx command (yarn cli)
        if: runner.os == 'Linux'
        run: yarn cli pptx samples/omochikaeri.pptx

      - name: Run pdf command (yarn cli)
        if: runner.os == 'Linux'
        run: yarn cli pdf samples/20251008_2.pdf

      - name: Upload generated scripts
        uses: actions/upload-artifact@v7
        with:
          name: generated-scripts-${{ matrix.os }}
          path: scripts/
